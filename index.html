<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Pollos Asados Guicho</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; }
        .form-container { max-width: 500px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #d9534f; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .radio-group { margin-top: 5px; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; margin-bottom: 5px; }
        .radio-group input { width: auto; margin-right: 10px; }
        button { background-color: #d9534f; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Pollos Asados Guicho</h2>
    <p class="subtitle">¡Haz tu pedido a domicilio! (Incluye arroz, tortillas hechas a mano y salsas)</p>
    
    <form action="#" method="POST">
        <!-- 1. Nombre -->
        <label for="nombre">1. Nombre:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">

        <!-- 2. Número de celular -->
        <label for="celular">2. Número de celular:</label>
        <input type="tel" id="celular" name="celular" required placeholder="10 dígitos">

        <!-- 3. Pollo asado entero -->
        <label for="pollo_entero">3. Pollo asado entero:</label>
        <input type="number" id="pollo_entero" name="pollo_entero" min="0" value="0">

        <!-- 4. Pollo asado mediano -->
        <label for="pollo_mediano">4. Pollo asado mediano:</label>
        <input type="number" id="pollo_mediano" name="pollo_mediano" min="0" value="0">

        <!-- Opcional: Costillitas -->
        <label for="costillitas">Costillitas asadas (Opcional):</label>
        <input type="number" id="costillitas" name="costillitas" min="0" value="0">

        <!-- Salsas -->
        <label>Preferencia de Salsas:</label>
        <div class="radio-group">
            <label><input type="radio" name="salsas" value="normal" checked> Salsas normales (Roja y Verde)</label>
            <label><input type="radio" name="salsas" value="dos_verdes"> Sin salsa roja, incluir 2 salsas verdes</label>
            <label><input type="radio" name="salsas" value="dos_rojas"> Sin salsa verde, incluir 2 salsas rojas</label>
        </div>

        <!-- Acompañamientos -->
        <label>Personalizar Arroz y Tortillas:</label>
        <div class="radio-group">
            <label><input type="radio" name="acompanamiento" value="normal" checked> Porción normal (Arroz y tortillas)</label>
            <label><input type="radio" name="acompanamiento" value="mas_tortillas"> Sin arroz, pero con más tortillas</label>
            <label><input type="radio" name="acompanamiento" value="mas_arroz"> Sin tortillas, pero con más arroz</label>
            <label><input type="radio" name="acompanamiento" value="todo_extra"> Con más tortillas y más arroz</label>
            <label><input type="radio" name="acompanamiento" value="nada"> No tortillas, no arroz, no salsas</label>
        </div>

        <!-- 5. Ubicación de entrega -->
        <label for="ubicacion">5. Ubicación de entrega:</label>
        <textarea id="ubicacion" name="ubicacion" rows="3" required placeholder="Calle, número, colonia y referencias"></textarea>

        <!-- 6. Confirmar pedido -->
        <button type="submit">6. Confirmar Pedido</button>
    </form>
</div>

</body>
</html>
